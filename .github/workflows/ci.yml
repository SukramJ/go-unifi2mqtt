# GitHub Actions CI for go-unifi2mqtt.
#
# Three jobs: lint (gofumpt + go vet), test (matrix across the OS
# triplet the daemon supports — race detector on, so CGo enabled for
# this single step), build (sanity-check that the binary produces a
# version banner). Concurrency cancels stale runs on the same ref so
# a fast-pushing developer isn't billed for outdated commits.
name: ci

on:
  push:
    branches: [main]
  # Every pull request, not just those targeting main: a stacked PR
  # based on another branch is still code that has to pass the gates,
  # and branch protection requires these checks before it can merge at
  # all. Filtering on the base branch left such a PR permanently
  # unmergeable with no way to see why.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CGO_ENABLED: "0"
  GO_VERSION: "1.26"
  # The tools below are pinned, not @latest. Dependabot tracks go.mod
  # requires, not go-install lines in a workflow, so these are bumped by
  # hand — deliberately: raise the version, run `make check`, and fix or
  # justify whatever the new release finds in the same change. Floating on
  # @latest makes these gates report on the calendar rather than on the
  # diff, and turns an unrelated upstream release into a red CI on someone
  # else's PR. gofumpt is the sharpest case: it is a formatter, so a new
  # release rewraps untouched code and reds main overnight. Keep these in
  # step with the versions `make setup` installs.
  GOFUMPT_VERSION: "v0.12.0"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go vet
        run: go vet ./...
      - name: gofumpt
        run: |
          go install mvdan.cc/gofumpt@${{ env.GOFUMPT_VERSION }}
          diff=$(gofumpt -l .)
          if [ -n "$diff" ]; then
            echo "::error::gofumpt would rewrite:"
            echo "$diff"
            exit 1
          fi

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go test
        env:
          # Race detector requires CGo; re-enable just for this step.
          CGO_ENABLED: "1"
        run: go test -race -count=1 -timeout=120s ./...

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: build daemon
        run: make build
      - name: version banner
        run: ./bin/unifi2mqtt --version
